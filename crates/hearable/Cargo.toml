[package]
name = "hearable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "hearable"
path = "src/lib.rs"

[[bin]]
name = "hearable"
path = "src/main.rs"

[features]
default = []
# Enable the real on-device ML engines (downloads native libs at build time).
sherpa = ["hearable-asr/sherpa", "hearable-audio/sherpa", "hearable-speaker/sherpa"]
# Enable real microphone capture.
mic = ["hearable-audio/mic"]

[dependencies]
hearable-core.workspace = true
hearable-audio.workspace = true
hearable-asr.workspace = true
hearable-speaker.workspace = true
hearable-store.workspace = true
clap.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
