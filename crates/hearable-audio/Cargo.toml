[package]
name = "hearable-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Real microphone capture via cpal (CoreAudio / ALSA / PulseAudio). Off in CI.
mic = ["dep:cpal"]
# Silero VAD via the official sherpa-onnx crate. Off by default (downloads native libs).
sherpa = ["dep:sherpa-onnx"]

[dependencies]
hearable-core.workspace = true
hound.workspace = true
rubato.workspace = true
rtrb.workspace = true
audioadapter.workspace = true
audioadapter-buffers.workspace = true
cpal = { workspace = true, optional = true }
sherpa-onnx = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
