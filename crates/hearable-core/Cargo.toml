[package]
name = "hearable-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Test-only sinks (BufferCaptionSink, SharedCaptionSink) for other crates' integration tests.
testutil = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
figment.workspace = true
toml.workspace = true
directories.workspace = true

[dev-dependencies]
# Enables `figment::Jail` for hermetic env-override tests (additive over workspace features).
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
